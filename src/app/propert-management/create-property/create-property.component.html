<div class="modal-overlay">
  <div class="modal-container">

    <div class="modal-header">
      <h2>{{heading}}</h2>
      <span class="close-btn" (click)="closeModal()">✖</span>
    </div>

    <div class="modal-body">

<!-- Step 1: Hamesha dikhega -->
@if(step === 1){  
  <app-basic-property-details [propertyForm]="propertyForm"></app-basic-property-details>
}

<!-- Step 2: Hamesha dikhega -->
@if(step === 2){
  <app-additional-parameters [propertyForm]="propertyForm"></app-additional-parameters>
}

<!-- Step 3: Yahan condition badlegi -->
@if(step === 3){
  @if(propertyForm.get('propertyType')?.value === 'Assessment') {
    <app-property-floor-details [propertyForm]="propertyForm"></app-property-floor-details>
  } @else {
    <app-annual-calculation [propertyForm]="propertyForm"></app-annual-calculation>
  }
}


@if(step === 4 && propertyForm.get('propertyType')?.value === 'Assessment'){
  <app-annual-calculation [propertyForm]="propertyForm"></app-annual-calculation>
}
    </div>
<div class="modal-footer">

  <!-- Left Side -->
  <div class="left-buttons">
    <button class="btn btn-back"
            (click)="prevStep()"
            [disabled]="step === 1">
      Back
    </button>
  </div>

  <!-- Right Side -->
  <div class="right-buttons">

    <button class="btn btn-clear"
           >
      Clear
    </button>

@if(step < totalSteps) {
  <button class="btn btn-primary" (click)="nextStep()">
    Next
  </button>
}

@if(step === totalSteps) {
  <button class="btn btn-primary" (click)="submit()">
    Submit
  </button>
}

  </div>

</div>

  </div>
</div>
