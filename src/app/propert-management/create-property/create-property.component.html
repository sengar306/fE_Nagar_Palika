<div class="modal-container card-shell">
  <div class="modal-header">
    <div>
      <h2>{{ heading }}</h2>
      <p>Step {{ step }} of 2</p>
    </div>
    <button class="close-btn" type="button" (click)="closeModal()">x</button>
  </div>

  <div class="modal-body">
    @if (submitError) {
      <app-error-alert
        title="Unable to save property"
        [message]="submitError"
        [showRetry]="true"
        (retry)="submit()">
      </app-error-alert>
    }

    @if (step === 1) {
      <app-basic-property-details [propertyForm]="propertyForm"></app-basic-property-details>
    }

    @if (step === 2) {
      <app-additional-parameters [propertyForm]="propertyForm"></app-additional-parameters>
    }
  </div>

  <div class="modal-footer">
    <button class="btn btn-back" type="button" (click)="prevStep()" [disabled]="step === 1">
      Back
    </button>

    <div class="right-buttons">
      <button class="btn btn-clear" type="button" (click)="clearForm()">Clear</button>

      @if (step < 2) {
        <button class="btn btn-primary" type="button" (click)="nextStep()">Next</button>
      } @else {
        <button class="btn btn-primary" type="button" (click)="submit()">Submit</button>
      }
    </div>
  </div>
</div>
