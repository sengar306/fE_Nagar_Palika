<div class="form-wrapper" [formGroup]="propertyForm">

  <!-- Is Plot Empty -->
  <div class="form-group">
    <label class="label">
      <input type="checkbox" formControlName="isPlotEmpty">
      Is Plot Empty
    </label>
  </div>

  <!-- House Age -->
  <div class="form-group">
    <label class="label">House Age</label>
    <select formControlName="houseAge">
      <option value="">Select House Age</option>
      <option value="1-10">1-10 Years</option>
      <option value="10-20">10-20 Years</option>
      <option value="20+">20+ Years</option>
    </select>
  </div>

  <!-- Floors -->
  <div *ngIf="!propertyForm.get('isPlotEmpty')?.value">

    <!-- No of Floors -->
    <div class="form-group">
      <label class="label">No of Floors</label>
      <input type="number" formControlName="noOfFloors">
    </div>

    <!-- Floors -->
    <div formArrayName="floors">

      <div *ngFor="let floor of floors.controls; let i = index"
           [formGroupName]="i"
           class="accordion">

        <!-- HEADER -->
        <div class="accordion-header" (click)="toggleAccordion(i)">
          <div class="left">
            <span class="icon">🏢</span>
            <span>Floor {{i + 1}}</span>
          </div>

          <div class="right">
            <span class="arrow">
              {{ floor.get('expanded')?.value ? '▲' : '▼' }}
            </span>
          </div>
        </div>

        <!-- BODY -->
        <div *ngIf="floor.get('expanded')?.value" class="accordion-body">
          <!-- Property Type -->
               <div class="form-group">
            <label class="label">Total Area</label>
            <input formControlName="totalArea" placeholder="Enter total area">
          </div>
          <div class="form-group">
            <label class="label">Property Type</label>
            <select formControlName="propertyType">
              <option value="">Select</option>
              <option value="Residential">Residential</option>
              <option value="Commercial">Commercial</option>
            </select>
          </div>

          <!-- Property Used As -->
       <div class="form-group">
  <label>Property Used As</label>

  <select formControlName="usageType" class="custom-select">
    <option value="">Select</option>

    @for (item of propertyTypes; track item) {
      <option [value]="item">{{ item }}</option>
    }

  </select>
</div>
          <!-- Occupancy -->
          <div class="form-group">
            <label class="label">Occupancy</label>
            <input formControlName="occupancy" placeholder="Owner / Tenant">
          </div>

          <!-- Is Rented -->
          <div class="form-group">
            <label class="label">Is Rented?</label>

            <div class="radio">
              <label>
                <input type="radio" value="yes" formControlName="isRented"> Yes
              </label>

              <label>
                <input type="radio" value="no" formControlName="isRented"> No
              </label>
            </div>
          </div>

          <!-- Rented Area -->
          <div class="form-group" *ngIf="floor.get('isRented')?.value === 'yes'">
            <label class="label">Rented Area</label>
            <input formControlName="rentedArea" placeholder="Enter rented area">
          </div>

        </div>

      </div>

    </div>

  </div>

</div>
