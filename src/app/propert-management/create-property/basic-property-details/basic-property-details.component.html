<div class="form-wrapper" [formGroup]="propertyForm">
  <div class="form-grid">
    <div class="form-group">
      <label>Zone</label>
      <select formControlName="zone">
        <option [ngValue]="null">Select Zone</option>
        @for(zone of zones; track zone.id){
        <option [ngValue]="zone">
          {{zone.name}}
        </option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Ward</label>
      <select formControlName="ward">
        <option [ngValue]="null">Select Ward</option>
        @for(ward of wards; track ward.id){
        <option [ngValue]="ward">
          {{ward.name}}
        </option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Ward Name</label>
      <input type="text" formControlName="wardName" placeholder="Enter ward name">
    </div>

    <div class="form-group">
      <label>Locality</label>
      <select formControlName="locality">
        <option [ngValue]="null">Select Locality</option>
        @for(locality of localities; track locality.id){
        <option [ngValue]="locality">
          {{locality.name}}
        </option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Owner Name</label>
      <input type="text" formControlName="ownerName" placeholder="Enter owner name">
    </div>

    <div class="form-group">
      <label>Father / Husband Name</label>
      <input type="text" formControlName="fatherName" placeholder="Enter father or husband name">
    </div>

    <div class="form-group">
      <label>Old House Number</label>
      <input type="text" formControlName="oldHouseNo" placeholder="Enter old house number">
    </div>

    <div class="form-group">
      <label>New Sequence Number</label>
      <input type="text" formControlName="sequenceNo" placeholder="Enter new sequence number">
    </div>

    <div class="form-group">
      <label>Road Width</label>
        <select formControlName="roadWidth">
        <option [ngValue]="null">Select road Width</option>
        @for(locality of roadWidth; track locality){
        <option [ngValue]="locality">
          {{locality.width}}
        </option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>Mobile Number</label>
      <input type="text" formControlName="mobileNo" placeholder="Enter mobile number">
    </div>

    <div class="form-group">
      <label>Latitude</label>
      <input type="text" formControlName="latitude" placeholder="Latitude will be filled automatically" readonly>
    </div>

    <div class="form-group">
      <label>Longitude</label>
      <input type="text" formControlName="longitude" placeholder="Longitude will be filled automatically" readonly>
    </div>

    <div class="form-group location-group">
      <label>Current Location</label>
      <button type="button" class="location-btn" (click)="getCurrentLocation()" [disabled]="isFetchingLocation">
        {{ isFetchingLocation ? 'Fetching Location...' : 'Use Device Location' }}
      </button>
      <small *ngIf="locationError" class="location-error">{{ locationError }}</small>
    </div>

    <div class="form-group">
      <label>Street Name</label>
      <input type="text" formControlName="streetName" placeholder="Enter street name">
    </div>

    <div class="form-group">
      <label>Street Number</label>
      <input type="text" formControlName="streetNo" placeholder="Enter street number">
    </div>

    <div class="form-group">
      <label>Building Type</label>
      <select formControlName="propertyType">
        <option selected>Select Building Type</option>
      @for (item of propertyCategories; track $index) {
           <option [value]="item">{{item}}</option>
      }
      </select>
    </div>
     <div class="form-group">
      <label>Construction Type</label>
      <select formControlName="builtType">
        <option [value]="">Select Building Type</option>
      @for (item of contructionType; track $index) {
           <option [value]="item">{{item}}</option>
      }
      </select>
    </div>

    <div class="form-group">
      <label>Total Plot Area</label>
      <input type="text" formControlName="plotArea" placeholder="Enter total plot area in sq ft">
    </div>
  </div>
</div>
