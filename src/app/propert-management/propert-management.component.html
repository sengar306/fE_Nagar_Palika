<div style="height: 90%;">
  <button (click)="openModal()" class="btn btn-primary">Create Property</button>  
@if(isModal) {
  <div class="modal-overlay">
    <div class="modal-box">
      <app-create-property (close)="closeModal()"></app-create-property>
    </div>
  </div>
}
<div class="ag-theme-alpine">
  <ag-grid-angular
    [rowData]="rowData"
    [columnDefs]="colDefs"
    pagination="true"
    style="width: 100%; height: 100%;"
    [gridOptions]="{ theme: 'legacy' }">
  </ag-grid-angular>
</div>
</div>
