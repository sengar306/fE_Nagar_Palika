<aside class="sidebar-shell" [class.mobile-open]="isOpen">
  <div class="brand-block">
    <div class="brand-mark">NP</div>
    <div>
      <p>Nagar Palika</p>
      <strong>Admin Console</strong>
    </div>
  </div>

  <nav class="menu-list">
    @for (item of menuItems; track item.route) {
      <button
        type="button"
        class="menu-item"
        [class.active]="isActive(item.route)"
        (click)="onClick(item.route)">
        <strong>{{ item.label }}</strong>
        <span>{{ item.hint }}</span>
      </button>
    }
  </nav>

  <div class="sidebar-footer">
    <p>Responsive municipal workflow</p>
    <span>Designed for desktop and in-app mobile view.</span>
  </div>
</aside>
