<div class="layout-shell">
  @if (isSidebarOpen) {
    <button class="mobile-backdrop" type="button" (click)="toggleSidebar()" aria-label="Close menu"></button>
  }

  <app-side-bar (close)="toggleSidebar()" [isOpen]="isSidebarOpen"></app-side-bar>

  <main class="main-panel">
    <app-header (menuToggle)="toggleSidebar()"></app-header>

    <section class="content-shell">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
